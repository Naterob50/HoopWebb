<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Odds Board — Live NBA Lines</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:      #0a0a0a;
    --black2:     #111111;
    --black3:     #1a1a1a;
    --border:     #2a2a2a;
    --border2:    #383838;
    --orange:     #ff6400;
    --orange-dim: rgba(255,100,0,0.12);
    --white:      #f5f5f5;
    --offwhite:   #c8c8c8;
    --muted:      #666666;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--white); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
  nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--border); }
  .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:.2em; color:var(--white); text-decoration:none; }
  .nav-logo em { color:var(--orange); font-style:normal; }
  .hero { padding: 40px; text-align: center; }
  .hero-title { font-family:'Bebas Neue',sans-serif; font-size: 4rem; color: var(--orange); }
</style>
</head>
<body>
<nav><a class="nav-logo" href="#">THE <em>ODDS</em> BOARD</a></nav>
<div class="hero">
  <h1 class="hero-title">THE ODDS BOARD</h1>
  <p>Live NBA Lines & Betting Intelligence (View Only)</p>
</div>
</body>
</html>
