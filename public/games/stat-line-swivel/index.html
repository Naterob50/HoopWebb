<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Line Swivel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --panel:#161616;
    --panel-2:#0F0F0F;
    --line:#3A3A3A;
    --amber:#FF7A1A;
    --amber-dim:#8C4110;
    --wood:#FFA24D;
    --chalk:#F5F5F5;
    --chalk-dim:#9C9C9C;
    --miss:#FF4A3D;
    --win:#FF7A1A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,122,26,0.08), transparent 60%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--ink);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    display:flex;
    justify-content:center;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  .wrap{width:100%;max-width:640px;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:2px solid var(--line);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  .brand h1{
    font-family:'Teko',sans-serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:1px;
    line-height:0.85;
    margin:0;
    color:var(--chalk);
  }
  .brand h1 span{color:var(--amber);}
  .brand p{
    font-family:'Teko',sans-serif;
    font-size:15px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--chalk-dim);
    margin:4px 0 0;
  }
  .puzzle-no{
    font-family:'Share Tech Mono',monospace;
    font-size:13px;
    color:var(--amber);
    text-align:right;
    border:1px solid var(--amber-dim);
    padding:6px 10px;
    border-radius:3px;
    white-space:nowrap;
  }
  .puzzle-no small{display:block;color:var(--chalk-dim);font-family:'Inter';font-size:9px;letter-spacing:1.5px;margin-bottom:2px;}
  .edition-tag{
    display:inline-block;
    font-family:'Teko',sans-serif;
    font-size:12px;
    letter-spacing:1px;
    color:var(--ink);
    background:var(--amber);
    border-radius:3px;
    padding:1px 6px;
    margin-left:4px;
    vertical-align:middle;
  }
  .next-timer{
    font-family:'Share Tech Mono',monospace;
    font-size:10px;
    color:var(--chalk-dim);
    margin-top:5px;
    white-space:nowrap;
  }
  .new-puzzle-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--amber-dim);
    border-radius:6px;
    padding:10px 14px;
    margin-bottom:16px;
    font-family:'Teko',sans-serif;
    font-size:16px;
    letter-spacing:0.5px;
    color:var(--chalk);
  }
  .new-puzzle-banner.show{display:flex;animation:pop 0.3s ease;}
  .new-puzzle-banner button{
    background:var(--amber);
    color:#1a0e00;
    font-size:14px;
    padding:5px 12px;
    white-space:nowrap;
  }

  /* ---------- Scoreboard Panel ---------- */
  .board{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 18px 22px;
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, transparent 2px, transparent 4px);
    pointer-events:none;
  }
  .board::after{
    content:"";
    position:absolute; top:-40%; left:-10%;
    width:60%; height:180%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.03), transparent);
    transform: rotate(12deg);
    pointer-events:none;
  }
  .redacted-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .tag{
    flex:1;
    min-width:130px;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
  }
  .tag .tag-label{
    font-family:'Teko',sans-serif;
    font-size:12px;
    letter-spacing:2px;
    color:var(--chalk-dim);
    text-transform:uppercase;
  }
  .redact-bar{
    height:20px;
    margin-top:4px;
    border-radius:2px;
    background: repeating-linear-gradient(45deg, #05070c, #05070c 6px, #0e1526 6px, #0e1526 12px);
    border:1px solid #000;
    position:relative;
    overflow:hidden;
    transition: background 0.4s;
  }
  .redact-bar.revealed{
    background:none;
    display:flex;
    align-items:center;
  }
  .redact-bar span{
    font-family:'Teko',sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.5px;
    color:var(--win);
  }

  .divider{
    text-align:center;
    font-family:'Teko',sans-serif;
    font-size:13px;
    letter-spacing:3px;
    color:var(--amber-dim);
    text-transform:uppercase;
    margin:14px 0 16px;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(84px,1fr));
    gap:10px;
  }
  .stat-cell{
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 6px 8px;
    text-align:center;
  }
  .stat-cell .val{
    font-family:'Share Tech Mono',monospace;
    font-size:26px;
    color:var(--amber);
    text-shadow:0 0 12px rgba(255,122,26,0.35);
    line-height:1;
  }
  .stat-cell .lab{
    font-family:'Teko',sans-serif;
    font-size:13px;
    letter-spacing:2px;
    color:var(--chalk-dim);
    margin-top:5px;
  }

  /* ---------- Guess Dots ---------- */
  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 10px;
    flex-wrap:wrap;
    gap:10px;
  }
  .dots-label{
    font-family:'Teko',sans-serif;
    font-size:13px;
    letter-spacing:2px;
    color:var(--chalk-dim);
    text-transform:uppercase;
  }
  .dots{display:flex;gap:7px;}
  .dot{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    transition:all 0.3s;
  }
  .dot.used-wrong{background:var(--miss);border-color:var(--miss);}
  .dot.used-win{background:var(--win);border-color:var(--win);}

  /* ---------- Input ---------- */
  .guess-row{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  input#guessInput{
    flex:1;
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:5px;
    padding:12px 12px;
    color:var(--chalk);
    font-family:'Inter';
    font-size:15px;
    outline:none;
    transition:border-color 0.2s;
  }
  input#guessInput:focus{border-color:var(--amber);}
  input#guessInput:disabled{opacity:0.5;}
  button{
    font-family:'Teko',sans-serif;
    font-weight:600;
    letter-spacing:1.5px;
    cursor:pointer;
    border:none;
    border-radius:5px;
    transition:transform 0.15s, filter 0.15s;
  }
  button:active{transform:scale(0.96);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  #guessBtn{
    background:var(--amber);
    color:#1a1200;
    font-size:18px;
    padding:0 22px;
  }
  #guessBtn:hover:not(:disabled){filter:brightness(1.1);}
  .shake{animation:shake 0.4s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  .feedback{
    min-height:20px;
    font-family:'Teko',sans-serif;
    font-size:16px;
    letter-spacing:1px;
    margin:6px 2px 4px;
  }
  .feedback.wrong{color:var(--miss);}
  .feedback.win{color:var(--win);}

  .history{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:8px 0 4px;
  }
  .chip{
    font-family:'Share Tech Mono',monospace;
    font-size:12px;
    color:var(--chalk-dim);
    background:var(--panel);
    border:1px solid var(--line);
    text-decoration:line-through;
    padding:4px 8px;
    border-radius:3px;
  }

  /* ---------- Clue rack ---------- */
  .clue-section{margin-top:26px;}
  .clue-section h2{
    font-family:'Teko',sans-serif;
    font-size:16px;
    letter-spacing:3px;
    color:var(--chalk-dim);
    text-transform:uppercase;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .clue-section h2::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .clue-rack{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  @media(min-width:480px){ .clue-rack{grid-template-columns:repeat(4,1fr);} }
  .flip-card{
    perspective:600px;
    height:74px;
  }
  .flip-inner{
    position:relative;
    width:100%;height:100%;
    text-align:center;
    transition:transform 0.6s;
    transform-style:preserve-3d;
  }
  .flip-card.revealed .flip-inner{transform:rotateY(180deg);}
  .flip-front,.flip-back{
    position:absolute;inset:0;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    backface-visibility:hidden;
    border:1px solid var(--line);
  }
  .flip-front{
    background:repeating-linear-gradient(135deg, var(--panel), var(--panel) 5px, var(--panel-2) 5px, var(--panel-2) 10px);
    color:var(--chalk-dim);
  }
  .flip-front .lock{font-size:16px;opacity:0.6;}
  .flip-front .clue-key{font-family:'Teko';font-size:12px;letter-spacing:2px;margin-top:4px;}
  .flip-back{
    background:var(--panel);
    border-color:var(--amber-dim);
    transform:rotateY(180deg);
    padding:4px;
  }
  .flip-back .clue-key{
    font-family:'Teko';font-size:11px;letter-spacing:2px;color:var(--amber-dim);text-transform:uppercase;
  }
  .flip-back .clue-val{
    font-family:'Share Tech Mono';font-size:14px;color:var(--chalk);margin-top:3px;padding:0 4px;
  }

  /* ---------- Result overlay ---------- */
  .result{
    margin-top:22px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
    background:var(--panel);
    display:none;
  }
  .result.show{display:block;animation:pop 0.35s ease;}
  @keyframes pop{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .result .headline{
    font-family:'Teko';
    font-size:30px;
    letter-spacing:1px;
    margin:0 0 4px;
  }
  .result.won .headline{color:var(--win);}
  .result.lost .headline{color:var(--miss);}
  .result .answer{
    font-family:'Teko';
    font-size:22px;
    color:var(--chalk);
    margin:0 0 2px;
  }
  .result .answer .team{color:var(--wood);}
  .result .fact{
    color:var(--chalk-dim);
    font-size:14px;
    line-height:1.5;
    margin:10px 0 16px;
  }
  .result-actions{display:flex;gap:10px;flex-wrap:wrap;}
  #shareBtn{
    background:var(--wood);color:#1a0e04;font-size:16px;padding:9px 16px;
  }
  #practiceBtn{
    background:transparent;border:1.5px solid var(--line) !important;color:var(--chalk-dim);font-size:16px;padding:9px 16px;
  }
  #practiceBtn:hover{border-color:var(--amber) !important;color:var(--amber);}
  #shareCardBtn{
    background:transparent;border:1.5px solid var(--amber) !important;color:var(--amber);font-size:16px;padding:9px 16px;
  }
  #shareCardBtn:hover:not(:disabled){background:var(--amber);color:#1a0e00;}
  #shareCardBtn:disabled{opacity:0.5;}

  .card-preview-wrap{
    display:none;
    margin-top:16px;
  }
  .card-preview-wrap.show{display:block;animation:pop 0.3s ease;}
  .card-preview-wrap canvas{
    width:100%;
    max-width:340px;
    display:block;
    margin:0 auto 10px;
    border-radius:10px;
    border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .card-preview-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  #downloadCardBtn{
    background:var(--amber);color:#1a0e00;font-size:15px;padding:8px 16px;
  }
  #nativeShareBtn{
    background:transparent;border:1.5px solid var(--line) !important;color:var(--chalk-dim);font-size:15px;padding:8px 16px;
  }
  #nativeShareBtn:hover{border-color:var(--amber) !important;color:var(--amber);}

  footer{
    text-align:center;
    margin-top:26px;
    color:var(--chalk-dim);
    font-size:11px;
    letter-spacing:1px;
    font-family:'Share Tech Mono',monospace;
    opacity:0.6;
  }

  datalist{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>STAT LINE<br><span>SWIVEL</span></h1>
      <p>Guess the game. One line at a time.</p>
    </div>
    <div class="puzzle-no">
      <small>Daily Puzzle</small>#<span id="puzzleNum">—</span> <span id="puzzleEdition" class="edition-tag"></span>
      <div id="nextPuzzleTimer" class="next-timer"></div>
    </div>
  </header>

  <div class="new-puzzle-banner" id="newPuzzleBanner">
    A new puzzle just dropped — <button id="refreshPuzzleBtn">load it</button>
  </div>

  <div class="board">
    <div class="redacted-row">
      <div class="tag">
        <div class="tag-label">Player</div>
        <div class="redact-bar" id="playerBar"></div>
      </div>
      <div class="tag">
        <div class="tag-label">Team</div>
        <div class="redact-bar" id="teamBar"></div>
      </div>
    </div>

    <div class="divider">◆ Box Score ◆</div>

    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="status-row">
    <div class="dots-label">Guesses Remaining</div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="guess-row">
    <input id="guessInput" type="text" placeholder="Who put up this stat line?" list="playerList" autocomplete="off">
    <button id="guessBtn">GUESS</button>
  </div>
  <datalist id="playerList"></datalist>

  <div class="feedback" id="feedback"></div>
  <div class="history" id="history"></div>

  <div class="clue-section">
    <h2>Clues</h2>
    <div class="clue-rack" id="clueRack"></div>
  </div>

  <div class="result" id="result">
    <p class="headline" id="resultHeadline"></p>
    <p class="answer" id="resultAnswer"></p>
    <p class="fact" id="resultFact"></p>
    <div class="result-actions">
      <button id="shareBtn">COPY RESULT</button>
      <button id="shareCardBtn">SHARE CARD</button>
      <button id="practiceBtn">PLAY ANOTHER (PRACTICE)</button>
    </div>
    <div class="card-preview-wrap" id="cardPreviewWrap">
      <canvas id="shareCanvas" width="1080" height="1080"></canvas>
      <div class="card-preview-actions">
        <button id="downloadCardBtn">DOWNLOAD IMAGE</button>
        <button id="nativeShareBtn">SHARE…</button>
      </div>
    </div>
  </div>

  <footer>STAT LINE SWIVEL &mdash; A NEW BOX SCORE EVERY DAY &mdash; STATS ARE APPROXIMATE, VIBES ARE EXACT</footer>
</div>

<script>

   fact:"The first 60-point triple-double in NBA history."},
  {player:"Shaquille O'Neal", team:"Los Angeles Lakers", year:2000, opponent:"Los Angeles Clippers", position:"C", minutes:33, conference:"Western",

   fact:"A career-high scoring night for Shaq, dominating despite playing only three quarters."},
  {player:"Russell Westbrook", team:"Oklahoma City Thunder", year:2017, opponent:"Orlando Magic", position:"PG", minutes:44, conference:"Western",

const MAX_GUESSES = 5;
const CLUE_ORDER = ["position","opponent","year","minutes"];
const CLUE_LABELS = {minutes:"Minutes", year:"Year", opponent:"Opponent", position:"Position"};
const CLUE_ICONS = {minutes:"⏱", year:"📅", opponent:"🆚", position:"📍"};

let state = {
  entry:null,
  puzzleNum:0,
  wrongGuesses:0,
  guessedList:[],
  over:false,
  won:false,
  practice:false
};

function normalize(s){
  return s.toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");
}

// Puzzle launch date — puzzle numbering starts counting from here.
const GAME_EPOCH_UTC = Date.UTC(2026, 0, 1, 0, 0, 0);
// Two fixed release times per day, in UTC, so every player worldwide gets
// the exact same puzzle at the exact same moment regardless of local time zone.
const SLOT_HOURS_UTC = [0, 12];

function currentSlot(){
  const now = Date.now();
  const msPerSlot = (24/SLOT_HOURS_UTC.length) * 60 * 60 * 1000;
  const slotIndex = Math.floor((now - GAME_EPOCH_UTC) / msPerSlot);
  const slotOfDay = ((slotIndex % SLOT_HOURS_UTC.length) + SLOT_HOURS_UTC.length) % SLOT_HOURS_UTC.length;
  const nextChangeAt = GAME_EPOCH_UTC + (slotIndex + 1) * msPerSlot;
  return {
    slotIndex,                       // ever-increasing, identical for every visitor at the same moment
    label: slotOfDay === 0 ? "AM" : "PM",
    nextChangeAt
  };
}

function puzzleIndexForSlot(slotIndex){
  // keep it non-negative regardless of slotIndex sign
  return ((slotIndex % DATA.length) + DATA.length) % DATA.length;
}

function formatCountdown(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = String(Math.floor(totalSec/3600)).padStart(2,"0");
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,"0");
  const s = String(totalSec%60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}

let countdownTimer = null;
let activeSlotIndex = null;

function startCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  const tick = ()=>{
    const slot = currentSlot();
    const el = document.getElementById("nextPuzzleTimer");
    if(el) el.textContent = "Next puzzle in " + formatCountdown(slot.nextChangeAt - Date.now());

    // if the slot has rolled over since we loaded, surface a refresh prompt
    // rather than yanking the board out from under an in-progress guess.
    if(activeSlotIndex !== null && slot.slotIndex !== activeSlotIndex && !state.practice){
      const banner = document.getElementById("newPuzzleBanner");
      if(banner) banner.className = "new-puzzle-banner show";
    }
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function populateDatalist(){
  const dl = document.getElementById("playerList");
  dl.innerHTML = "";
  DATA.forEach(e=>{
    const opt = document.createElement("option");
    opt.value = e.player;
    dl.appendChild(opt);
  });
}

function buildStatGrid(entry){
  const grid = document.getElementById("statGrid");
  grid.innerHTML = "";
  entry.stats.forEach(([label,val])=>{
    const cell = document.createElement("div");
    cell.className = "stat-cell";
    cell.innerHTML = `<div class="val">${val}</div><div class="lab">${label}</div>`;
    grid.appendChild(cell);
  });
}

function buildClueRack(){
  const rack = document.getElementById("clueRack");
  rack.innerHTML = "";
  CLUE_ORDER.forEach(key=>{
    const card = document.createElement("div");
    card.className = "flip-card";
    card.id = "clue-"+key;
    card.innerHTML = `
      <div class="flip-inner">
        <div class="flip-front">
          <div class="lock">${CLUE_ICONS[key]}</div>
          <div class="clue-key">${CLUE_LABELS[key].toUpperCase()}</div>
        </div>
        <div class="flip-back">
          <div class="clue-key">${CLUE_LABELS[key]}</div>
          <div class="clue-val" id="clue-val-${key}"></div>
        </div>
      </div>`;
    rack.appendChild(card);
  });
}

function buildDots(){
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  for(let i=0;i<MAX_GUESSES;i++){
    const d = document.createElement("div");
    d.className = "dot";
    d.id = "dot-"+i;
    dots.appendChild(d);
  }
}

function formatClueValue(entry,key){
  switch(key){
    case "minutes": return entry.minutes + " MIN";
    case "year": return entry.year;
    case "opponent": return "vs " + entry.opponent;
    case "position": return entry.position;
  }
}

function startPuzzle(entry, num, practice, edition){
  state = {entry, puzzleNum:num, wrongGuesses:0, guessedList:[], over:false, won:false, practice};
  document.getElementById("puzzleNum").textContent = practice ? "PRACTICE" : num;
  document.getElementById("puzzleEdition").textContent = (!practice && edition) ? edition : "";
  document.getElementById("puzzleEdition").style.display = (!practice && edition) ? "inline-block" : "none";
  document.getElementById("newPuzzleBanner").className = "new-puzzle-banner";
  buildStatGrid(entry);
  buildClueRack();
  buildDots();

  const playerBar = document.getElementById("playerBar");
  const teamBar = document.getElementById("teamBar");
  playerBar.className = "redact-bar";
  playerBar.innerHTML = "";
  teamBar.className = "redact-bar";
  teamBar.innerHTML = "";

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("history").innerHTML = "";
  document.getElementById("result").className = "result";
  document.getElementById("cardPreviewWrap").className = "card-preview-wrap";
  document.getElementById("guessInput").value = "";
  document.getElementById("guessInput").disabled = false;
  document.getElementById("guessBtn").disabled = false;
  document.getElementById("guessInput").focus();
}

function revealClue(key){
  const val = formatClueValue(state.entry, key);
  document.getElementById("clue-val-"+key).textContent = val;
  document.getElementById("clue-"+key).classList.add("revealed");
}

function markDot(idx, cls){
  const d = document.getElementById("dot-"+idx);
  if(d) d.classList.add(cls);
}

function addHistoryChip(text){
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.textContent = text;
  document.getElementById("history").appendChild(chip);
}

function endGame(won){
  state.over = true;
  state.won = won;
  document.getElementById("guessInput").disabled = true;
  document.getElementById("guessBtn").disabled = true;

  // reveal all remaining clues + name/team
  CLUE_ORDER.forEach(revealClue);
  const playerBar = document.getElementById("playerBar");
  const teamBar = document.getElementById("teamBar");
  playerBar.classList.add("revealed");
  playerBar.innerHTML = `<span>${state.entry.player}</span>`;
  teamBar.classList.add("revealed");
  teamBar.innerHTML = `<span>${state.entry.team}</span>`;

  const result = document.getElementById("result");
  result.className = "result show " + (won ? "won":"lost");
  document.getElementById("resultHeadline").textContent = won ? "NAILED IT" : "STUMPED";
  document.getElementById("resultAnswer").innerHTML =
    `${state.entry.player} &mdash; <span class="team">${state.entry.team}, ${state.entry.year}</span>`;
  document.getElementById("resultFact").textContent = state.entry.fact;
}

function submitGuess(){
  if(state.over) return;
  const raw = document.getElementById("guessInput").value;
  if(!raw.trim()) return;
  const norm = normalize(raw);
  const correct = state.entry.aliases.some(a => normalize(a) === norm);

  const feedback = document.getElementById("feedback");

  if(correct){
    markDot(state.wrongGuesses, "used-win");
    feedback.textContent = "Correct — that's the guy.";
    feedback.className = "feedback win";
    endGame(true);
    return;
  }

  // wrong guess
  markDot(state.wrongGuesses, "used-wrong");
  addHistoryChip(raw.trim());
  state.guessedList.push(raw.trim());
  state.wrongGuesses++;

  const input = document.getElementById("guessInput");
  input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");

  if(state.wrongGuesses <= CLUE_ORDER.length){
    revealClue(CLUE_ORDER[state.wrongGuesses-1]);
    feedback.textContent = `Not quite. Clue unlocked: ${CLUE_LABELS[CLUE_ORDER[state.wrongGuesses-1]]}.`;
  } else {
    feedback.textContent = "Not quite.";
  }
  feedback.className = "feedback wrong";

  if(state.wrongGuesses >= MAX_GUESSES){
    endGame(false);
  }
  input.value = "";
  input.focus();
}

function buildShareText(){
  const squares = [];
  for(let i=0;i<state.wrongGuesses;i++) squares.push("🟥");
  if(state.won) squares.push("🟩");
  const label = state.practice ? "Practice" : ("#"+state.puzzleNum);
  const score = state.won ? `${state.wrongGuesses+1}/5` : "X/5";
  return {
    label, score, squares,
    text: `Stat Line Swivel ${label} — ${score}\n${squares.join("")}`
  };
}

function shareResult(){
  const {text} = buildShareText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById("shareBtn");
      const old = btn.textContent;
      btn.textContent = "COPIED!";
      setTimeout(()=>btn.textContent = old, 1500);
    }).catch(()=>{ alert(text); });
  } else {
    alert(text);
  }
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const words = text.split(" ");
  let line = "";
  let lines = [];
  words.forEach(word=>{
    const test = line ? line+" "+word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0,maxLines);
    lines[maxLines-1] = lines[maxLines-1].replace(/\s*\S*$/, "") + "…";
  }
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
  return y + lines.length*lineHeight;
}

async function drawShareCard(){
  const canvas = document.getElementById("shareCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  if(document.fonts && document.fonts.ready){
    try{
      await Promise.all([
        document.fonts.load("700 90px Teko"),
        document.fonts.load("600 40px Teko"),
        document.fonts.load("400 34px 'Share Tech Mono'"),
        document.fonts.load("400 30px Inter")
      ]);
      await document.fonts.ready;
    }catch(e){/* fall back to default fonts */}
  }

  const {label, score, squares} = buildShareText();
  const entry = state.entry;

  // background
  ctx.fillStyle = "#0A0A0A";
  ctx.fillRect(0,0,W,H);
  const glow = ctx.createRadialGradient(W/2,-80,80,W/2,-80,780);
  glow.addColorStop(0,"rgba(255,122,26,0.18)");
  glow.addColorStop(1,"rgba(255,122,26,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  // outer frame
  ctx.strokeStyle = "#3A3A3A";
  ctx.lineWidth = 3;
  roundRectPath(ctx,24,24,W-48,H-48,28);
  ctx.stroke();

  const cx = W/2;
  let y = 118;

  // eyebrow label
  ctx.textAlign = "center";
  ctx.fillStyle = "#FF7A1A";
  ctx.font = "600 30px Teko, sans-serif";
  ctx.fillText((state.practice ? "PRACTICE ROUND" : "DAILY PUZZLE " + label).toUpperCase(), cx, y);

  // title
  y += 78;
  ctx.font = "700 92px Teko, sans-serif";
  ctx.fillStyle = "#F5F5F5";
  ctx.fillText("STAT LINE", cx, y);
  y += 84;
  ctx.fillStyle = "#FF7A1A";
  ctx.fillText("SWIVEL", cx, y);

  // divider
  y += 46;
  ctx.strokeStyle = "#3A3A3A";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx-260,y);
  ctx.lineTo(cx+260,y);
  ctx.stroke();

  // score headline
  y += 90;
  ctx.font = "700 76px Teko, sans-serif";
  ctx.fillStyle = state.won ? "#FF7A1A" : "#FF4A3D";
  ctx.fillText(state.won ? "SOLVED " + score : "STUMPED " + score, cx, y);

  // guess squares
  y += 60;
  const sq = 74, gap = 18, total = 5;
  const startX = cx - (total*sq + (total-1)*gap)/2;
  for(let i=0;i<total;i++){
    const x = startX + i*(sq+gap);
    const isWrong = i < state.wrongGuesses;
    const isWin = state.won && i === state.wrongGuesses;
    ctx.lineWidth = 3;
    if(isWrong){
      ctx.fillStyle = "#2A1512";
      roundRectPath(ctx,x,y,sq,sq,12);
      ctx.fill();
      ctx.strokeStyle = "#FF4A3D";
      roundRectPath(ctx,x,y,sq,sq,12);
      ctx.stroke();
      ctx.strokeStyle = "#FF4A3D";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x+20,y+20); ctx.lineTo(x+sq-20,y+sq-20);
      ctx.moveTo(x+sq-20,y+20); ctx.lineTo(x+20,y+sq-20);
      ctx.stroke();
    } else if(isWin){
      ctx.fillStyle = "#FF7A1A";
      roundRectPath(ctx,x,y,sq,sq,12);
      ctx.fill();
      ctx.strokeStyle = "#FFA24D";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x+18,y+sq/2);
      ctx.lineTo(x+sq/2-4,y+sq-22);
      ctx.lineTo(x+sq-18,y+20);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#3A3A3A";
      roundRectPath(ctx,x,y,sq,sq,12);
      ctx.stroke();
    }
  }

  // mini box score chips
  y += sq + 64;
  const chips = entry.stats.slice(0,4);
  const chipW = 220, chipGap = 16;
  const chipsStartX = cx - (chips.length*chipW + (chips.length-1)*chipGap)/2;
  chips.forEach(([lab,val],i)=>{
    const x = chipsStartX + i*(chipW+chipGap);
    ctx.fillStyle = "#161616";
    roundRectPath(ctx,x,y,chipW,120,10);
    ctx.fill();
    ctx.strokeStyle = "#3A3A3A";
    roundRectPath(ctx,x,y,chipW,120,10);
    ctx.stroke();
    ctx.fillStyle = "#FF7A1A";
    ctx.font = "400 46px 'Share Tech Mono', monospace";
    ctx.fillText(String(val), x+chipW/2, y+62);
    ctx.fillStyle = "#9C9C9C";
    ctx.font = "600 22px Teko, sans-serif";
    ctx.fillText(lab, x+chipW/2, y+96);
  });

  // answer reveal
  y += 120 + 40;
  ctx.fillStyle = "#F5F5F5";
  ctx.font = "600 46px Teko, sans-serif";
  y = wrapText(ctx, `${entry.player} — ${entry.team}, ${entry.year}`, cx, y, W-160, 50, 2);

  // footer divider
  ctx.strokeStyle = "#3A3A3A";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx-200,H-104);
  ctx.lineTo(cx+200,H-104);
  ctx.stroke();

  // footer
  ctx.fillStyle = "#9C9C9C";
  ctx.font = "400 24px 'Share Tech Mono', monospace";
  ctx.fillText("STAT LINE SWIVEL · A NEW BOX SCORE EVERY DAY", cx, H-64);
}

async function openShareCard(){
  const btn = document.getElementById("shareCardBtn");
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = "BUILDING…";
  try{
    await drawShareCard();
    document.getElementById("cardPreviewWrap").className = "card-preview-wrap show";
    document.getElementById("cardPreviewWrap").scrollIntoView({behavior:"smooth", block:"nearest"});
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
}

function downloadShareCard(){
  const canvas = document.getElementById("shareCanvas");
  const label = state.practice ? "practice" : ("puzzle-" + state.puzzleNum);
  const link = document.createElement("a");
  link.download = `stat-line-swivel-${label}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

async function nativeShareCard(){
  const canvas = document.getElementById("shareCanvas");
  const {text} = buildShareText();
  canvas.toBlob(async (blob)=>{
    if(!blob) return;
    const file = new File([blob], "stat-line-swivel.png", {type:"image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:"Stat Line Swivel", text});
      }catch(e){ /* user cancelled share sheet, no action needed */ }
    } else {
      downloadShareCard();
    }
  }, "image/png");
}

function launchPuzzleForCurrentSlot(){
  const slot = currentSlot();
  const idx = puzzleIndexForSlot(slot.slotIndex);
  activeSlotIndex = slot.slotIndex;
  startPuzzle(DATA[idx], puzzleNumberFor(slot.slotIndex), false, slot.label);
}

function puzzleNumberFor(slotIndex){
  // Friendly, small, always-positive puzzle numbers starting at #1 on launch day.
  return slotIndex + 1;
}

function launchPractice(){
  let idx;
  do{ idx = Math.floor(Math.random()*DATA.length); }
  while(DATA.length>1 && state.entry === DATA[idx]);
  startPuzzle(DATA[idx], 0, true);
}

document.getElementById("guessBtn").addEventListener("click", submitGuess);
document.getElementById("guessInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") submitGuess();
});
document.getElementById("shareBtn").addEventListener("click", shareResult);
document.getElementById("shareCardBtn").addEventListener("click", openShareCard);
document.getElementById("downloadCardBtn").addEventListener("click", downloadShareCard);
document.getElementById("nativeShareBtn").addEventListener("click", nativeShareCard);
document.getElementById("practiceBtn").addEventListener("click", launchPractice);
document.getElementById("refreshPuzzleBtn").addEventListener("click", launchPuzzleForCurrentSlot);

populateDatalist();
launchPuzzleForCurrentSlot();
startCountdown();
</script>
